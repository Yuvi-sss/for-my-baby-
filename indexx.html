<style>

<style>

#letter button{margin-top:20px}
</style>
<script>
window.addEventListener('load',()=>{
const icons=['❤️','💞','💋','🎀'];

let s=document.createElement('div');
s.className='floaticon';
s.textContent=icons[i%icons.length];
s.style.left=Math.random()*100+'vw';
s.style.animationDelay=(Math.random()*10)+'s';
document.body.appendChild(s);
}
});
</script>

<div id="letter"><h1 style="font-family:cursive">Happy Girlfriend Day ❤️</h1><p id="txt" style="font-family:Georgia,serif;font-size:20px"></p></div>
<script>
const heart=document.getElementById('heart');
const pts=[];
for(let t=0;t<6.28;t+=0.12){
 let x=16*Math.pow(Math.sin(t),3),y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
 pts.push([140+x*8,120-y*8]);
}
function start(){
 if(p.value!=="2125"){alert("Wrong password");return;}
 login.style.display='none';scene.style.display='block';
 pts.forEach((pt,i)=>{
 let d=document.createElement('div');d.className='word';d.textContent='I Love You';
 d.style.left=(Math.random()*280)+'px';d.style.top=(Math.random()*240)+'px';
 heart.appendChild(d);
 setTimeout(()=>{d.style.left=pt[0]+'px';d.style.top=pt[1]+'px';},50);
 });
 setTimeout(()=>{name.style.opacity=1;},2400);
 setTimeout(()=>{scene.style.display='none';letter.style.display='block';type();},4300);
}
const msg=`Happy Girlfriend Day, Mera baccha ❤️

Sabse pehle... thank you. Thank you meri life me aane ke liye or meri galtiyo pe mujhe baar baar ek aur chance dene ke liye.

Mujhe pata hai hum bahut ladte hain. Kabhi meri wajah se, kabhi misunderstandings ki wajah se. Aur haan, mujhse bahut galtiyan hoti hain. Kabhi main tumhari feelings ko samajhne me late ho jata hoon but I really love you baby always so please stay with me forever. ❤️`;
function type(){let i=0;let e=document.getElementById('txt');let iv=setInterval(()=>{e.textContent+=msg[i++]||'';if(i>msg.length)clearInterval(iv)},30);}
</script></body></html>
